  </text>

  <!-- Code Window -->
  <rect x="690" y="55" width="440" height="280" rx="15" fill="#161B22" stroke="#30363D" stroke-width="2"></rect>

  <!-- Window Header -->
  <circle cx="720" cy="82" r="6" fill="#FF5F56"></circle>
  <circle cx="742" cy="82" r="6" fill="#FFBD2E"></circle>
  <circle cx="764" cy="82" r="6" fill="#27C93F"></circle>

  <text x="805" y="88" fill="#8B949E" font-family="monospace" font-size="14">
