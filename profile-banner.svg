  </text>

  <!-- Tech badges -->
  <rect x="70" y="310" width="92" height="34" rx="8" fill="#161B22"></rect>
  <text x="88" y="333" fill="#F7DF1E" font-family="Arial" font-size="15" font-weight="600">
